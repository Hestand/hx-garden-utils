calculate_plan:
  name: Calculate plan
  description: >-
    Build tonight's watering plan from the current buckets. Does not
    open a valve or call a controller. Commits today's ET and rain if that has
    not happened yet.
  fields:
    hub:
      name: Hub
      description: Hub name. Needed only when more than one Smart Water hub is loaded.
      selector:
        text:
    notify:
      name: Notify
      description: Send the plan to the hub's notify target when one is set.
      default: true
      selector:
        boolean:

reset_bucket:
  name: Reset bucket
  description: >-
    Set a zone's soil-water deficit to zero (field capacity). Does not open a valve.
  fields:
    hub:
      name: Hub
      description: Hub name, if you have more than one.
      selector:
        text:
    zone:
      name: Zone
      description: Zone name.
      required: true
      selector:
        text:

set_bucket:
  name: Set bucket
  description: >-
    Set a zone's soil-water deficit. Provide millimeters or inches. The value
    is clamped to total available water. Does not open a valve.
  fields:
    hub:
      name: Hub
      selector:
        text:
    zone:
      name: Zone
      required: true
      selector:
        text:
    deficit_mm:
      name: Deficit (mm)
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          unit_of_measurement: mm
    deficit_in:
      name: Deficit (in)
      selector:
        number:
          min: 0
          max: 20
          step: 0.01
          unit_of_measurement: in

mark_watered:
  name: Mark watered
  description: >-
    Credit net irrigation already applied, in millimeters or inches. Leave the
    depth empty to refill the zone to field capacity. Does not open a valve.
  fields:
    hub:
      name: Hub
      selector:
        text:
    zone:
      name: Zone
      required: true
      selector:
        text:
    depth_mm:
      name: Net depth (mm)
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          unit_of_measurement: mm
    depth_in:
      name: Net depth (in)
      selector:
        number:
          min: 0
          max: 20
          step: 0.01
          unit_of_measurement: in

skip_zone:
  name: Skip zone
  description: >-
    Leave a zone out of the plan through a date (inclusive). Defaults to
    tomorrow. Does not open a valve.
  fields:
    hub:
      name: Hub
      selector:
        text:
    zone:
      name: Zone
      required: true
      selector:
        text:
    until:
      name: Until
      description: Local date in YYYY-MM-DD. The zone is skipped through that morning.
      selector:
        text:

pause_zone:
  name: Pause zone
  description: >-
    Skip a zone for a number of local days. Zero clears the pause. Does not
    open a valve.
  fields:
    hub:
      name: Hub
      selector:
        text:
    zone:
      name: Zone
      required: true
      selector:
        text:
    days:
      name: Days
      description: Local days to skip, including today. Zero clears the pause.
      required: true
      selector:
        number:
          min: 0
          max: 365
          step: 1
          mode: box

set_adjustment:
  name: Set adjustment
  description: >-
    Scale the planned depth for a zone. 100 leaves it unchanged. 0 keeps the
    zone off the timeline. Does not open a valve.
  fields:
    hub:
      name: Hub
      selector:
        text:
    zone:
      name: Zone
      required: true
      selector:
        text:
    percent:
      name: Adjustment
      required: true
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: "%"
          mode: box

run_now:
  name: Run now
  description: >-
    Log the zone's current planned runtime. This does not start the run and
    does not call the zone's on/off entity.
  fields:
    hub:
      name: Hub
      selector:
        text:
    zone:
      name: Zone
      required: true
      selector:
        text:

simulate:
  name: Simulate a week
  description: >-
    Play a 7-day weather week through the same planner a live hub uses.
    A preset is enough. Custom days replace the preset for this run.
    This does not open a valve, call a controller, or change the stored bucket.
  fields:
    hub:
      name: Hub
      description: Hub name. Needed only when more than one Smart Water hub is loaded.
      selector:
        text:
    scenario:
      name: Weather week
      description: Ignored when custom days are set.
      selector:
        select:
          options:
            - hot_dry
            - mild_spring
            - rainy
            - heat_then_storm
            - fall_cooldown
    bucket:
      name: Starting soil
      description: Full is field capacity. Half is half the root zone used. Raw is ready to water.
      selector:
        select:
          options:
            - full
            - half
            - raw
    start_date:
      name: First day
      description: YYYY-MM-DD. Empty starts today.
      selector:
        text:
    days:
      name: Custom days
      description: >-
        Optional YAML list that replaces the preset. Each item can set high_f,
        low_f, humidity, wind_mph, cloud (0 clear to 1 overcast), and rain_in.
      selector:
        text:
          multiline: true

stop_all:
  name: Stop all watering
  description: Turn off any zone Smart Water currently has on.
  fields:
    hub:
      name: Hub
      description: Hub name. Needed only when more than one Smart Water hub is loaded.
      selector:
        text:

reset_learning:
  name: Reset moisture learning
  description: Set a zone's learned available-water factor back to 1.
  fields:
    hub:
      name: Hub
      description: Hub name, if you have more than one.
      selector:
        text:
    zone:
      name: Zone
      description: Zone name.
      required: true
      selector:
        text:

reset_flow_learning:
  name: Reset flow learning
  description: Clear learned flow, the flow alert, and a skip that is waiting for reset. Leave the zone empty to reset every zone on the hub.
  fields:
    hub:
      name: Hub
      description: Hub name, if you have more than one.
      selector:
        text:
    zone:
      name: Zone
      description: Zone name. Empty resets every zone and a main-line lock.
      selector:
        text:

start_audit:
  name: Start catch-cup audit
  description: >-
    Run one zone for a set number of minutes so you can catch water in cups.
    Freeze, wind, rain, and the zone's runtime cap still apply. This is one
    continuous run, not the usual cycle-and-soak.
  fields:
    hub:
      name: Hub
      description: Hub name, if you have more than one.
      selector:
        text:
    zone:
      name: Zone
      description: Zone name.
      required: true
      selector:
        text:
    minutes:
      name: Minutes
      description: How long to run. A longer request is cut to this zone's nightly cap.
      required: true
      selector:
        number:
          min: 1
          max: 180
          step: 1
          unit_of_measurement: min
          mode: box

submit_audit:
  name: Submit catch-cup audit
  description: >-
    Enter every cup, including cups that stayed empty. At least 4 readings.
    Sixteen in a grid is better. Inches need no diameter. Millilitres need
    the cup diameter. The result is stored as this zone's measured rate and
    scheduling efficiency.
  fields:
    hub:
      name: Hub
      description: Hub name, if you have more than one.
      selector:
        text:
    zone:
      name: Zone
      description: Zone name.
      required: true
      selector:
        text:
    readings:
      name: Cup readings
      description: Inches or millilitres, separated by commas. Example 0.2, 0.25, 0.3, 0.15.
      required: true
      selector:
        text:
    unit:
      name: Unit
      description: in for inches, ml for millilitres.
      default: in
      selector:
        select:
          options:
            - in
            - ml
    cup_diameter_in:
      name: Cup diameter
      description: Required for millilitres. The inside diameter of the cup, in inches.
      selector:
        number:
          min: 0.5
          max: 12
          step: 0.1
          unit_of_measurement: in
          mode: box
    minutes:
      name: Minutes
      description: Leave empty to use the minutes from the audit that just ran.
      selector:
        number:
          min: 1
          max: 180
          step: 1
          unit_of_measurement: min
          mode: box
