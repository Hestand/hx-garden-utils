[project]
name = "smart-water"
version = "0.3.0"
description = "Home Assistant irrigation planner. Computes the plan and does not open valves."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = [".", "custom_components"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
